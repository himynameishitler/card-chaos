
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Chaos v0.2 — Blob Mayhem</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#f0f5ff;font-family:system-ui,Arial;text-align:center}
h1{margin:15px 0 4px;color:#7de5ff}
p{margin:5px 0 12px;color:#b8c7e2}
canvas{display:block;width:min(96vw,960px);height:auto;margin:auto;border:2px solid #52658b;border-radius:12px;background:#142039;cursor:crosshair}
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#080c18e8;padding:16px}
#panel{background:#1b2946;border:1px solid #6479a8;border-radius:18px;padding:24px;max-width:760px;width:100%}
#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.card,button{background:#293d67;color:white;border:2px solid #6b86bd;border-radius:12px;padding:15px;cursor:pointer;font:inherit}
.card:hover,button:hover{background:#38578c}
.card strong{display:block;color:#92f1ff;margin-bottom:8px}
.card small{color:#d0dcf5}
@media(max-width:600px){#cards{grid-template-columns:1fr}.card{padding:10px}}
</style>
</head>
<body>
<h1>🟦 CARD CHAOS: BLOB MAYHEM</h1>
<p>A/D move · Space/W jump (double jump!) · Mouse aim · Hold click to shoot · R restart</p>
<canvas id="game" width="960" height="560"></canvas>
<p id="status">First to 5 wins. Lose a round to choose a card!</p>
<div id="overlay"><div id="panel">
<h2 id="heading"></h2>
<p id="message"></p>
<div id="cards"></div>
<button id="again" style="display:none">Play again</button>
</div></div>
<script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const overlay=document.querySelector('#overlay'),heading=document.querySelector('#heading'),message=document.querySelector('#message'),cardsBox=document.querySelector('#cards'),again=document.querySelector('#again'),status=document.querySelector('#status');
const W=960,H=560,GRAVITY=0.48,keys={},mouse={x:720,y:250,down:false};
let player,enemy,bullets=[],particles=[],platforms=[],round=1,wins=[0,0],phase='fight',last=0,clock=0,roundPause=false;
const CARD_POOL=[
 {id:'rapid',name:'Rapid Fire',desc:'Shoot 20% faster.'},
 {id:'damage',name:'Heavy Shots',desc:'Deal 25% more damage.'},
 {id:'multi',name:'Multishot',desc:'Fire an extra projectile with spread.'},
 {id:'bounce',name:'Ricochet',desc:'Bullets bounce off walls once more.'},
 {id:'jump',name:'Triple Jump',desc:'Gain an extra midair jump.'},
 {id:'spring',name:'Super Spring',desc:'Jump 16% higher.'},
 {id:'speed',name:'Quick Blob',desc:'Move 15% faster.'},
 {id:'health',name:'Vitality',desc:'Increase max health by 25.'},
 {id:'heal',name:'Lifesteal',desc:'Recover 15% of damage dealt.'},
 {id:'boom',name:'Explosive Shots',desc:'Hits damage nearby enemies too.'},
 {id:'home',name:'Homing',desc:'Bullets curve toward your opponent.'},
 {id:'shield',name:'Shield',desc:'Start each round with 20 bonus shield.'}
];
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const rand=(a,b)=>a+Math.random()*(b-a);
function blob(x,color,isAI){return {x,y:400,vx:0,vy:0,r:19,color,isAI,hp:100,maxHp:100,shield:0,ground:false,jumps:0,cd:0,score:0,cards:{},squash:0,face:1}}
function level(){
 platforms=[
  {x:0,y:526,w:960,h:34,dx:0,dy:0,baseX:0,baseY:526,mode:0},
  {x:125,y:408,w:190,h:15,baseX:125,baseY:408,mode:1,dx:0,dy:0},
  {x:390,y:318,w:175,h:15,baseX:390,baseY:318,mode:2,dx:0,dy:0},
  {x:665,y:405,w:175,h:15,baseX:665,baseY:405,mode:1,dx:0,dy:0},
  {x:330,y:185,w:240,h:15,baseX:330,baseY:185,mode:3,dx:0,dy:0}
 ];
}
function upgradeStats(b){let c=b.cards;b.maxHp=100+25*(c.health||0);b.hp=b.maxHp;b.shield=20*(c.shield||0)}
function startRound(){level();bullets=[];particles=[];clock=0;roundPause=false;player.x=150;player.y=350;enemy.x=810;enemy.y=350;for(let b of [player,enemy]){b.vx=b.vy=b.cd=0;b.ground=false;b.jumps=0;b.squash=0;upgradeStats(b)}phase='fight';overlay.style.display='none';status.textContent=`Round ${round} · You ${wins[0]} – ${wins[1]} CPU`}
function newMatch(){player=blob(150,'#65e5ff',false);enemy=blob(810,'#ff718d',true);wins=[0,0];round=1;startRound()}
function jump(b){const allowed=2+(b.cards.jump||0);if(b.ground||b.jumps<allowed){b.vy=-12.6*Math.pow(1.16,b.cards.spring||0);b.ground=false;b.jumps++;b.squash=-0.2;burst(b.x,b.y+18,b.color,6)}}
function burst(x,y,color,n=9){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-3,3),vy:rand(-3,3),life:rand(12,28),color})}
function fire(b,targetX,targetY){if(b.cd>0)return;let c=b.cards,amount=Math.min(7,1+(c.multi||0));let ang=Math.atan2(targetY-b.y,targetX-b.x);for(let i=0;i<amount;i++){let a=ang+(i-(amount-1)/2)*0.15;bullets.push({x:b.x+Math.cos(a)*22,y:b.y+Math.sin(a)*22,vx:Math.cos(a)*9.5,vy:Math.sin(a)*9.5,owner:b,life:125,bounces:c.bounce||0,damage:12*Math.pow(1.25,c.damage||0),homing:c.home||0,boom:c.boom||0})}b.cd=Math.max(7,27*Math.pow(0.8,c.rapid||0));b.vx-=Math.cos(ang)*0.32;burst(b.x,b.y,b.color,2)}
function updatePlatforms(){for(let p of platforms){let oldX=p.x,oldY=p.y;if(p.mode===1)p.x=p.baseX+Math.sin(clock*0.016+(p.baseX/100))*65;if(p.mode===2)p.y=p.baseY+Math.sin(clock*0.018)*55;if(p.mode===3)p.x=p.baseX+Math.sin(clock*0.012)*105;p.dx=p.x-oldX;p.dy=p.y-oldY}}
function moveBlob(b,dir){b.vx+=dir*(b.ground?0.75:0.52);b.vx*=b.ground?0.81:0.95;b.vx=clamp(b.vx,-5.1*Math.pow(1.15,b.cards.speed||0),5.1*Math.pow(1.15,b.cards.speed||0));if(dir)b.face=dir;let oldBottom=b.y+b.r;b.vy+=GRAVITY;b.x+=b.vx;b.y+=b.vy;b.x=clamp(b.x,b.r,W-b.r);b.ground=false;for(let p of platforms){if(b.vy>=0&&oldBottom<=p.y+Math.max(0,p.dy)+6&&b.y+b.r>=p.y&&b.x+b.r>p.x&&b.x-b.r<p.x+p.w){b.y=p.y-b.r;b.vy=0;b.ground=true;b.jumps=0;b.x+=p.dx;b.squash=0.14}}if(b.y>H+80){b.hp=0}b.squash*=0.84;if(b.cd>0)b.cd--}
function aiThink(){let dx=player.x-enemy.x,dy=player.y-enemy.y;let dir=Math.sign(dx);if(Math.abs(dx)<155)dir=-dir;let edge=enemy.x<70?1:enemy.x>890?-1:dir;moveBlob(enemy,edge);if((enemy.ground&&player.y<enemy.y-40)||(enemy.ground&&Math.random()<0.025)||(!enemy.ground&&enemy.vy>1&&Math.random()<0.013))jump(enemy);if(Math.random()<0.75)fire(enemy,player.x+player.vx*8+rand(-35,35),player.y+player.vy*5+rand(-28,28))}
function hit(target,bullet){let damage=bullet.damage;if(target.shield>0){let used=Math.min(target.shield,damage);target.shield-=used;damage-=used}target.hp-=damage;if(bullet.owner.cards.heal)bullet.owner.hp=Math.min(bullet.owner.maxHp,bullet.owner.hp+damage*0.15*bullet.owner.cards.heal);target.vx+=bullet.vx*0.3;target.vy+=bullet.vy*0.15;burst(bullet.x,bullet.y,target.color,10);if(bullet.boom){burst(bullet.x,bullet.y,'#ffcd6c',12);target.hp-=bullet.damage*0.2*bullet.boom}}
function updateBullets(){for(let i=bullets.length-1;i>=0;i--){let b=bullets[i],target=b.owner===player?enemy:player;b.life--;if(b.homing){let angle=Math.atan2(target.y-b.y,target.x-b.x),desiredX=Math.cos(angle)*9.5,desiredY=Math.sin(angle)*9.5,t=0.022*b.homing;b.vx+=(desiredX-b.vx)*t;b.vy+=(desiredY-b.vy)*t}b.x+=b.vx;b.y+=b.vy;let remove=b.life<=0;if(b.x<5||b.x>W-5){if(b.bounces>0){b.vx*=-1;b.bounces--;b.x=clamp(b.x,5,W-5)}else remove=true}if(b.y<5||b.y>H){if(b.bounces>0){b.vy*=-1;b.bounces--;b.y=clamp(b.y,5,H-5)}else remove=true}for(let p of platforms){if(b.x>p.x&&b.x<p.x+p.w&&b.y>p.y&&b.y<p.y+p.h){if(b.bounces>0){b.vy*=-1;b.bounces--;b.y+=b.vy*2}else remove=true;break}}if(Math.hypot(b.x-target.x,b.y-target.y)<target.r+5){hit(target,b);remove=true}if(remove)bullets.splice(i,1)}}
function endRound(){if(roundPause)return;roundPause=true;let winner=player.hp>0?0:1;if(player.hp<=0&&enemy.hp<=0)winner=player.hp>=enemy.hp?0:1;wins[winner]++;phase='choice';overlay.style.display='flex';if(wins[winner]>=5){phase='over';heading.textContent=winner===0?'YOU WIN THE MATCH!':'CPU WINS THE MATCH!';message.textContent=`Final score: ${wins[0]} – ${wins[1]}`;cardsBox.innerHTML='';again.style.display='inline-block';return}let loser=winner===0?enemy:player;heading.textContent=winner===0?'ROUND WON!':'ROUND LOST!';message.textContent=winner===0?'CPU picks a card. Click continue!':'Choose one card to improve your blob!';cardsBox.innerHTML='';again.style.display='none';let options=[...CARD_POOL].sort(()=>Math.random()-0.5).slice(0,3);if(loser===enemy){let choice=options[Math.floor(Math.random()*options.length)];enemy.cards[choice.id]=(enemy.cards[choice.id]||0)+1;message.textContent=`CPU selected ${choice.name}.`;let btn=document.createElement('button');btn.textContent='Next round';btn.onclick=nextRound;cardsBox.append(btn)}else{for(let card of options){let btn=document.createElement('button');btn.className='card';let title=document.createElement('strong');title.textContent=card.name;let desc=document.createElement('small');desc.textContent=card.desc;btn.append(title,desc);btn.onclick=()=>{player.cards[card.id]=(player.cards[card.id]||0)+1;nextRound()};cardsBox.append(btn)}}}
function nextRound(){round++;startRound()}
function drawBlob(b){ctx.save();ctx.translate(b.x,b.y);let sx=1+b.squash,sy=1-b.squash;ctx.scale(sx,sy);ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=16;ctx.beginPath();ctx.ellipse(0,0,b.r,b.r*0.92,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#142039';ctx.beginPath();ctx.arc(-6+b.face*3,-4,3.3,0,Math.PI*2);ctx.arc(6+b.face*3,-4,3.3,0,Math.PI*2);ctx.fill();ctx.restore();if(b.shield>0){ctx.strokeStyle='#fff9';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,26,0,Math.PI*2);ctx.stroke()}}
function draw(){ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#142440');bg.addColorStop(1,'#1d2b47');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff0a';for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let p of platforms){ctx.fillStyle=p.mode?'#7184ac':'#50637e';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#a7b8d9';ctx.fillRect(p.x,p.y,p.w,4)}for(let b of bullets){ctx.fillStyle=b.owner.color;ctx.shadowColor=b.owner.color;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;for(let p of particles){ctx.globalAlpha=clamp(p.life/25,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;drawBlob(player);drawBlob(enemy);healthBar(player,20,20);healthBar(enemy,650,20);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 23px system-ui';ctx.fillText(`${wins[0]}  —  ${wins[1]}`,W/2,43);ctx.font='15px system-ui';ctx.fillText(`ROUND ${round}`,W/2,65);ctx.textAlign='left'}
function healthBar(b,x,y){ctx.fillStyle='#07101f';ctx.fillRect(x,y,290,22);ctx.fillStyle=b.color;ctx.fillRect(x,y,290*clamp(b.hp/b.maxHp,0,1),22);ctx.strokeStyle='#a2b7d7';ctx.strokeRect(x,y,290,22);ctx.font='bold 13px system-ui';ctx.fillStyle='white';ctx.fillText(`${b.isAI?'CPU':'YOU'}  ${Math.max(0,Math.ceil(b.hp))}/${b.maxHp}${b.shield?' +'+Math.ceil(b.shield)+' shield':''}`,x+8,y+16)}
function tick(t){let dt=Math.min((t-last)/16.667||1,2);last=t;if(phase==='fight'){for(let n=0;n<Math.max(1,Math.floor(dt));n++){clock++;updatePlatforms();moveBlob(player,(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0));aiThink();if(mouse.down)fire(player,mouse.x,mouse.y);updateBullets();for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)particles.splice(i,1)}if(player.hp<=0||enemy.hp<=0){endRound();break}}}draw();requestAnimationFrame(tick)}
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyR'){newMatch();return}if((e.code==='Space'||e.code==='KeyW'||e.code==='ArrowUp')&&!keys[e.code]&&phase==='fight')jump(player);keys[e.code]=true});
window.addEventListener('keyup',e=>keys[e.code]=false);
window.addEventListener('blur',()=>{for(let k in keys)keys[k]=false;mouse.down=false});
canvas.addEventListener('pointermove',e=>{let r=canvas.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height});
canvas.addEventListener('pointerdown',e=>{mouse.down=true;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointerup',()=>mouse.down=false);
canvas.addEventListener('pointercancel',()=>mouse.down=false);
again.onclick=newMatch;
newMatch();
requestAnimationFrame(tick);
</script>
</body>
</html>
